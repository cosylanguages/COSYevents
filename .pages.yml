media:
  input: images
  output: /images

content:
  - name: mind_matters_sessions
    label: Mind Matters Sessions (.md)
    type: folder
    path: sessions/mind-matters
    extension: md
    format: yaml-frontmatter
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: page_title
        label: Page Title
        type: string
      - name: breadcrumbs_current
        label: Breadcrumbs Current Page
        type: string
      - name: club_tag
        label: Club Tag
        type: string
      - name: date
        label: Date
        type: string
      - name: theme_class
        label: Theme Class
        type: string
      - name: decorator_icon
        label: Decorator Icon
        type: string
      - name: duration
        label: Duration
        type: string
      - name: languages
        label: Languages
        type: string
      - name: level
        label: Level
        type: string
      - name: topic
        label: Topic
        type: string
      - name: target_grammar
        label: Target Grammar Focus
        type: string
      - name: hero_background
        label: Hero Background
        type: string
      - name: description
        label: Description
        type: rich-text
      - name: mind_profile
        label: Subconscious Mind Profile
        type: object
        fields:
          - name: core_tendency
            label: Core Human Tendency
            type: string
          - name: trigger
            label: Subconscious Trigger
            type: string
          - name: phenomenon
            label: Psychological Phenomenon
            type: string
          - name: anchor
            label: Self-Reflection Anchor
            type: string
      - name: film_metadata
        label: Film Metadata (Cinema Club)
        type: object
        fields:
          - name: movie_title
            label: Movie Title
            type: string
          - name: director
            label: Director
            type: string
          - name: release_year
            label: Release Year
            type: string
          - name: suggested_genre
            label: Suggested Genre
            type: string
          - name: age_rating
            label: Age Rating
            type: string
      - name: song_metadata
        label: Song Metadata (Karaoke Club)
        type: object
        fields:
          - name: song_title
            label: Song Title
            type: string
          - name: artist
            label: Artist
            type: string
          - name: release_year
            label: Release Year
            type: string
          - name: genre
            label: Genre
            type: string
          - name: lyrics_gap_fill_lines
            label: Lyrics Gap-Fill Lines (Max 8 lines allowed)
            type: list
            field:
              type: string
      - name: science_takeaway
        label: Science Takeaway (Keeping Up with Science)
        type: object
        fields:
          - name: core_finding
            label: Core Finding
            type: string
          - name: scientific_field
            label: Field of Study
            type: string
          - name: real_world_application
            label: Real World Application
            type: string
      - name: sensitive_topic_warning
        label: Sensitive Topic Warning
        type: string
      - name: vocabulary
        label: Session Vocabulary
        type: list
        fields:
          - name: word
            label: Word
            type: string
          - name: definition
            label: Definition
            type: string
          - name: example
            label: Example
            type: string
      - name: warm_up
        label: Warm-up Section
        type: object
        fields:
          - name: instruction
            label: Instruction
            type: string
          - name: questions
            label: Questions
            type: list
            field:
              type: string
      - name: round_1
        label: Round 1
        type: object
        fields:
          - name: title
            label: Round Title
            type: string
          - name: badge
            label: Badge
            type: string
          - name: instruction
            label: Instruction
            type: string
          - name: items
            label: Questions
            type: list
            fields:
              - name: main
                label: Main Question
                type: string
              - name: personal
                label: Personal Application Question (Optional)
                type: string
      - name: lets_speak_together
        label: Let's Speak Together
        type: object
        fields:
          - name: title
            label: Section Title
            type: string
          - name: task_title
            label: Task Title (Structured)
            type: string
          - name: task_description
            label: Task Description (Structured)
            type: string
          - name: grammar_requirements
            label: Grammar Requirements (Structured)
            type: list
            field:
              type: string
          - name: note
            label: Custom Note / Rich-Text Fallback
            type: rich-text
      - name: round_2
        label: Round 2
        type: object
        fields:
          - name: title
            label: Round Title
            type: string
          - name: badge
            label: Badge
            type: string
          - name: instruction
            label: Instruction
            type: string
          - name: items
            label: Scenarios / Dilemmas
            type: list
            fields:
              - name: main
                label: Main Question / Statement
                type: string
              - name: personal
                label: Personal Application Question (Optional)
                type: string
      - name: mistakes
        label: Teacher Notes / Linguistic Corrections
        type: list
        fields:
          - name: wrong
            label: Incorrect (HTML / String)
            type: string
          - name: wrong_part
            label: Erroneous Part (Structured)
            type: string
          - name: right
            label: Correct (HTML / String)
            type: string
          - name: right_part
            label: Corrected Part (Structured)
            type: string
          - name: note
            label: Explanation Note
            type: string

  - name: speaking_clubs
    label: Speaking Clubs
    type: file
    path: data/events/speaking-clubs.json
    fields:
      - name: id
        label: Event ID
        type: string
        required: true
      - name: title
        label: Event Title
        type: string
        required: true
      - name: description
        label: Description
        type: rich-text
      - name: clubs
        label: Clubs & Topics
        type: list
        fields:
          - name: id
            label: Club ID
            type: string
          - name: title
            label: Club Title
            type: string
          - name: description
            label: Description
            type: string
          - name: level_range
            label: Level Range
            type: string

  - name: karaoke
    label: Karaoke Sessions
    type: file
    path: data/events/karaoke-club.json
    fields:
      - name: id
        label: Event ID
        type: string
        required: true
      - name: title
        label: Event Title
        type: string
        required: true
      - name: description
        label: Description
        type: rich-text
      - name: themes
        label: Song Themes & Playlists
        type: list
        fields:
          - name: id
            label: Theme ID
            type: string
          - name: title
            label: Theme Title
            type: string
          - name: level_range
            label: Level Range
            type: string

  - name: film_sessions
    label: Film Sessions (Cinema Club)
    type: file
    path: data/events/cinema-club.json
    fields:
      - name: id
        label: Event ID
        type: string
        required: true
      - name: title
        label: Movie / Event Title
        type: string
        required: true
      - name: description
        label: Description
        type: rich-text
      - name: sessions
        label: Film Sessions
        type: list
        fields:
          - name: id
            label: Session ID
            type: string
          - name: title
            label: Movie Title
            type: string
          - name: suggested_genre
            label: Suggested Genre
            type: string
          - name: level_range
            label: Level Range
            type: string

  - name: game_evenings
    label: Game Evenings
    type: file
    path: data/events/game-evenings.json
    fields:
      - name: event_type
        label: Event Type
        type: string
      - name: title
        label: Title
        type: string
        required: true
      - name: description
        label: Description
        type: rich-text
      - name: lineups
        label: Session Lineups
        type: list
        fields:
          - name: id
            label: Lineup ID
            type: string
          - name: title
            label: Lineup Title
            type: string
          - name: target_level
            label: Target Level
            type: string

  - name: long_reads
    label: Long Reads
    type: file
    path: data/events/long-reads.json
    fields:
      - name: id
        label: Event ID
        type: string
      - name: title
        label: Title
        type: string
        required: true
      - name: description
        label: Description
        type: rich-text
      - name: articles
        label: Reading Articles
        type: list
        fields:
          - name: id
            label: Article ID
            type: string
          - name: title
            label: Article Title
            type: string
          - name: level_range
            label: Target Level
            type: string
