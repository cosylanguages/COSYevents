<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting to Free Practice — COSYlanguages</title>
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://cosylanguages.github.io/COSYlanguages/">
  <meta http-equiv="refresh" content="0; url=https://cosylanguages.github.io/COSYlanguages/">
  <script src="../shared/js/cosy-theme.js"></script>
  <link rel="stylesheet" href="../shared/css/hub.css">
  <script>
    window.location.replace("https://cosylanguages.github.io/COSYlanguages/");
  </script>
  <link rel="stylesheet" href="https://cosylanguages.github.io/COSYlanguages/css/ecosystem-strip.css">
</head>
<body>
  <div data-ecosystem-strip data-self="events"></div>

  <main class="hub-main" style="max-width: 600px; margin: 4rem auto; text-align: center;">
    <div style="background: var(--cosy-surface); border: 1px solid var(--cosy-border); border-radius: var(--cosy-radius); padding: 2.5rem 1.5rem; box-shadow: var(--cosy-shadow);">
      <h1 style="font-size: 1.5rem; color: var(--cosy-primary-dark); margin-bottom: 1rem;">Taking you to COSYlanguages...</h1>
      <p style="color: var(--cosy-text-muted); font-size: 1rem;">
        If nothing happens, <a href="https://cosylanguages.github.io/COSYlanguages/" style="color: var(--cosy-primary); font-weight: 700; text-decoration: underline;">click here to continue</a>.
      </p>
    </div>
  </main>
<footer>
  <p>&copy; COSYevents &bull; COSYlanguages Ecosystem</p>
</footer>
  <script src="https://cosylanguages.github.io/COSYlanguages/js/ecosystem-strip.js" defer></script>
</body>
</html>
