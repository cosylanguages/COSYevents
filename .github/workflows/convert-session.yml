name: Convert Session & Propose Vocabulary PR to COSYdata

on:
  push:
    paths:
      - 'sessions/**/*.json'
    branches:
      - main

jobs:
  convert-and-propose-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout COSYevents
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run Session Converter Script
        run: |
          mkdir -p generated_exports
          for session in $(find sessions -name "*.json"); do
            echo "Processing session $session..."
            python3 scripts/convert_session.py "$session" --out-dir generated_exports
          done

      - name: Checkout COSYdata Repository
        uses: actions/checkout@v3
        with:
          repository: 'cosylanguages/COSYdata'
          token: ${{ secrets.COSYDATA_PAT || secrets.GITHUB_TOKEN }}
          path: 'COSYdata_repo'

      - name: Copy Vocabulary Snippets to COSYdata
        run: |
          mkdir -p COSYdata_repo/imports/cosyevents
          cp generated_exports/*_vocab.json COSYdata_repo/imports/cosyevents/

      - name: Create Pull Request in COSYdata
        uses: peter-evans/create-pull-request@v5
        with:
          path: 'COSYdata_repo'
          token: ${{ secrets.COSYDATA_PAT || secrets.GITHUB_TOKEN }}
          commit-message: 'feat(vocabulary): add proposed vocabulary from COSYevents session'
          branch: 'cosyevents/vocabulary-update'
          title: 'PROPOSAL: New vocabulary entries exported from COSYevents session'
          body: |
            This PR contains automatically generated vocabulary entries exported from live COSYevents sessions for manual review and ingestion.

            - Generated by `scripts/convert_session.py` in COSYevents.
            - Matches COSYdata schema `schemas/vocabulary.schema.json`.
          labels: 'vocabulary-proposal, cosyevents'
