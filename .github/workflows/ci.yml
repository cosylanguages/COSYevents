name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Check forbidden names
        run: node scripts/check-names.js

      - name: Validate events and sessions schema
        run: npm run validate

      - name: Build public data and run leak prevention tests
        run: npm run test

      - name: Run RLS policy tests
        run: npm run test:rls
