name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Check forbidden names
        run: node scripts/check-names.js

      - name: Validate events and sessions schema
        run: npm run validate

      - name: Verify master session catalog matches disk
        run: node scripts/verify_catalog.js

      - name: Check orphan CSS classes
        run: npm run check-orphans

      - name: Check page isolation (no new cross-repo or cross-folder coupling)
        run: npm run check-isolation

      - name: Verify vendored COSYlanguages assets are untouched
        run: npm run check-vendor

      - name: Check brand colour contrast
        run: npm run check-contrast

      - name: No third-party CDN assets
        run: npm run check-external-assets

      - name: Verify sitemap is up to date
        run: npm run check-sitemap

      - name: Build public data and run leak prevention tests
        run: npm run test

