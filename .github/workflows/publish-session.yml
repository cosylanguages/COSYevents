name: Publish Studio Session

# Founders publish a session from COSYevents Studio without a terminal:
#   Studio -> Publish -> "Copy session JSON" -> Actions -> Publish Studio Session -> Run workflow.
# The workflow converts the session, validates the repository and opens a pull request.
# Nothing is merged automatically, and nothing is sent to Supabase.
# Everything committed is public. Never paste private or unapproved material.
on:
  workflow_dispatch:
    inputs:
      session_json:
        description: 'Session JSON copied from Studio (max about 65,000 characters)'
        required: true
        type: string
      club:
        description: 'Club directory under sessions/, e.g. mind-matters'
        required: true
        type: string
      club_name:
        description: 'Only for a NEW club: display name, e.g. "Mind Matters"'
        required: false
        type: string
      format:
        description: 'Only for a NEW club: Speaking Club, Cinema Club, Karaoke Club, Long Read or Games'
        required: false
        type: string
      update:
        description: 'Replace an existing session with the same slug'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Write session file
        env:
          # Passed through the environment, never interpolated into the shell script.
          SESSION_JSON: ${{ inputs.session_json }}
        run: printf '%s' "$SESSION_JSON" > "$RUNNER_TEMP/studio-session.json"

      - name: Publish session
        id: publish
        env:
          CLUB: ${{ inputs.club }}
          CLUB_NAME: ${{ inputs.club_name }}
          FORMAT: ${{ inputs.format }}
          UPDATE: ${{ inputs.update }}
        run: |
          args=("$RUNNER_TEMP/studio-session.json" --club "$CLUB")
          if [ -n "$CLUB_NAME" ]; then args+=(--club-name "$CLUB_NAME"); fi
          if [ -n "$FORMAT" ]; then args+=(--format "$FORMAT"); fi
          if [ "$UPDATE" = "true" ]; then args+=(--update); fi
          node scripts/session_publish.js "${args[@]}"
          slug=$(node -e 'console.log(JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).slug)' "$RUNNER_TEMP/studio-session.json")
          echo "slug=$slug" >> "$GITHUB_OUTPUT"

      - name: Run repository checks
        run: npm test

      - name: Open pull request
        uses: peter-evans/create-pull-request@v5
        with:
          branch: studio/session-${{ steps.publish.outputs.slug }}
          commit-message: 'feat(session): publish ${{ steps.publish.outputs.slug }} from Studio'
          title: 'Publish session: ${{ steps.publish.outputs.slug }}'
          body: |
            Session published from COSYevents Studio.

            - Generated by `scripts/session_publish.js` (validated against the session schema).
            - Everything in this PR becomes public when merged. Review the text and links first.
            - No Supabase upload was performed.
          add-paths: |
            events/**
            sessions/**
            data/sessions.json
            public-events.json
