name: Database Access Rules Tests

on:
  push:
    branches: [ main ]
    paths:
      - 'supabase/**'
      - 'scripts/run_db_tests.sh'
      - '.github/workflows/db-tests.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'supabase/**'
      - 'scripts/run_db_tests.sh'
      - '.github/workflows/db-tests.yml'

jobs:
  db-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run database access control tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: npm run test-db
