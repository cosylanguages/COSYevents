name: Daily Spotlights Update

on:
  schedule:
    # Run every day at 04:00 UTC
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-daily-spotlights:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Fetch today's cultural and science spotlights
        env:
          # Publish yesterday/today/tomorrow so every timezone reads its own local date.
          SPOTLIGHT_WINDOW: '1'
        run: node scripts/fetch_daily_spotlights.js

      - name: Verify the spotlight window covers every timezone
        run: |
          node -e "
          const d = require('./data/daily-spotlights.json');
          const now = new Date();
          const key = now.toISOString().slice(0, 10);
          if (d.date !== key) { console.error('Stale spotlight file:', d.date); process.exit(1); }
          const need = [-1, 0, 1].map((o) => {
            const x = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate() + o));
            return x.toISOString().slice(0, 10);
          });
          const missing = need.filter((k) => !d.days || !d.days[k]);
          if (missing.length) { console.error('Day window missing:', missing.join(', ')); process.exit(1); }
          "

      - name: Commit and push if updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/daily-spotlights.json
          if git diff --staged --quiet; then
            echo "No changes in daily spotlights."
          else
            git commit -m "chore(daily): update daily spotlights for $(date -u +'%Y-%m-%d')"
            git push
          fi
