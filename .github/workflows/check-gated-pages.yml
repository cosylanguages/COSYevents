name: Check Gated Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check-gated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run Gated Pages Check
        run: npm run check:gated
