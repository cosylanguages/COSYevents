name: Check i18n Manifest & Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check-i18n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run check-i18n
      - run: npm run test-lang
      - run: npm run test-calendar-i18n
      - run: npm run test-event-filter
