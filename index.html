<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COSYevents - Language Learning Events & Public Calendar</title>
  <meta name="description" content="Discover language-learning events and upcoming sessions across multiple languages and levels.">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'media',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdf4',
              100: '#dcfce7',
              500: '#22c55e',
              600: '#16a34a',
              700: '#15803d',
              900: '#14532d'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="min-h-full flex flex-col bg-slate-50 text-slate-900 dark:bg-slate-900 dark:text-slate-100 transition-colors duration-200">

  <!-- Navigation Header -->
  <header class="border-b border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900/80 backdrop-blur sticky top-0 z-10">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex items-center justify-between">
      <a href="./index.html" class="flex items-center space-x-3 text-slate-900 dark:text-white font-bold text-xl tracking-tight focus:outline-none focus:ring-2 focus:ring-brand-500 rounded-md">
        <span class="bg-brand-600 text-white px-2.5 py-1 rounded-lg text-sm uppercase tracking-wider">COSY</span>
        <span>events</span>
      </a>
      <span class="text-xs font-semibold uppercase tracking-wider px-2.5 py-1 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 border border-slate-200 dark:border-slate-700">
        Public Calendar
      </span>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-grow max-w-6xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 sm:py-12">

    <!-- Hero / Header Section -->
    <section class="mb-10 text-center sm:text-left">
      <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight text-slate-900 dark:text-white">
        Language Learning Events & Sessions
      </h1>
      <p class="mt-3 text-lg text-slate-600 dark:text-slate-300 max-w-3xl">
        Explore interactive communicative events and upcoming group sessions designed to elevate your fluency.
      </p>
    </section>

    <!-- Events Container -->
    <div id="events-list" class="space-y-8" aria-live="polite">
      <div class="p-6 bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 animate-pulse">
        <div class="h-6 bg-slate-200 dark:bg-slate-700 rounded w-1/3 mb-4"></div>
        <div class="h-4 bg-slate-200 dark:bg-slate-700 rounded w-2/3 mb-6"></div>
        <div class="space-y-3">
          <div class="h-12 bg-slate-100 dark:bg-slate-900 rounded-lg"></div>
          <div class="h-12 bg-slate-100 dark:bg-slate-900 rounded-lg"></div>
        </div>
      </div>
    </div>

  </main>

  <!-- Footer -->
  <footer class="mt-auto border-t border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900/50 py-6">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 text-center text-sm text-slate-500 dark:text-slate-400">
      <p>&copy; COSYevents — Language Learning Calendar & Session Catalog</p>
    </div>
  </footer>

  <!-- Script to load public-events.json -->
  <script>
    async function loadPublicEvents() {
      const container = document.getElementById('events-list');
      try {
        const response = await fetch('./public-events.json');
        if (!response.ok) {
          throw new Error('Failed to load public events data.');
        }
        const events = await response.json();

        if (!events || events.length === 0) {
          container.innerHTML = `
            <div class="p-8 text-center bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400">
              No public events found at this time.
            </div>
          `;
          return;
        }

        container.innerHTML = events.map(event => {
          const statusBadge = event.status === 'current'
            ? '<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-800 dark:bg-green-900/40 dark:text-green-300 border border-green-200 dark:border-green-800">Current</span>'
            : event.status === 'upcoming'
            ? '<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-blue-100 text-blue-800 dark:bg-blue-900/40 dark:text-blue-300 border border-blue-200 dark:border-blue-800">Upcoming</span>'
            : '<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-slate-100 text-slate-800 dark:bg-slate-800 dark:text-slate-300 border border-slate-200 dark:border-slate-700">Past</span>';

          const languagesBadges = (event.languages || []).map(lang =>
            `<span class="inline-block px-2 py-0.5 text-xs font-medium bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-300 rounded border border-slate-200 dark:border-slate-600">${lang}</span>`
          ).join(' ');

          const sessionsList = (event.sessions && event.sessions.length > 0)
            ? event.sessions.map(s => `
                <li class="p-4 bg-slate-50 dark:bg-slate-900/60 rounded-lg border border-slate-200 dark:border-slate-700/80 hover:border-slate-300 dark:hover:border-slate-600 transition-colors">
                  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2">
                    <div>
                      <h3 class="text-base font-semibold text-slate-900 dark:text-slate-100">
                        ${s.title}
                      </h3>
                      <p class="text-sm text-slate-600 dark:text-slate-400 mt-0.5">
                        <span class="font-medium text-slate-700 dark:text-slate-300">Theme:</span> ${s.theme}
                      </p>
                    </div>
                    <div class="flex items-center gap-3 text-xs text-slate-500 dark:text-slate-400 shrink-0">
                      <span class="inline-flex items-center gap-1 font-mono bg-white dark:bg-slate-800 px-2 py-1 rounded border border-slate-200 dark:border-slate-700">
                        🗓️ ${s.date}
                      </span>
                      <span class="font-medium px-2 py-1 bg-brand-50 dark:bg-brand-900/30 text-brand-700 dark:text-brand-300 rounded border border-brand-200 dark:border-brand-800">
                        ${s.language}
                      </span>
                    </div>
                  </div>
                </li>
              `).join('')
            : '<p class="text-sm text-slate-500 dark:text-slate-400 italic">No public session titles listed for this event.</p>';

          return `
            <article class="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 overflow-hidden">
              <div class="p-6 border-b border-slate-100 dark:border-slate-700/50">
                <div class="flex flex-wrap items-center justify-between gap-2 mb-2">
                  <h2 class="text-xl font-bold text-slate-900 dark:text-white">${event.title}</h2>
                  <div class="flex items-center gap-2">
                    ${statusBadge}
                    ${languagesBadges}
                  </div>
                </div>
                <p class="text-slate-600 dark:text-slate-300 text-sm leading-relaxed">${event.description}</p>
              </div>
              <div class="p-6 bg-slate-50/50 dark:bg-slate-800/50">
                <h3 class="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-3">
                  Sessions Overview
                </h3>
                <ul class="space-y-3">
                  ${sessionsList}
                </ul>
              </div>
            </article>
          `;
        }).join('');

      } catch (err) {
        console.error('Error rendering public events:', err);
        container.innerHTML = `
          <div class="p-6 bg-red-50 dark:bg-red-900/20 text-red-700 dark:text-red-300 rounded-xl border border-red-200 dark:border-red-800 text-sm">
            Failed to load public event listings.
          </div>
        `;
      }
    }

    document.addEventListener('DOMContentLoaded', loadPublicEvents);
  </script>
</body>
</html>
